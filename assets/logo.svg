<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WorkDesk</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46413e"/>
      <stop offset="1" stop-color="#1b1d1e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1c7" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#fbf1c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#fe8019"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32302f"/>
      <stop offset="1" stop-color="#282828"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="icon"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
  </defs>

  <!-- the icon plate -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#gloss)"/>
  <rect x="102" y="102" width="820" height="820" rx="186" fill="none" stroke="#ebdbb2" stroke-opacity=".12" stroke-width="4"/>

  <g clip-path="url(#icon)">
    <g transform="translate(12 30)">
      <!-- other WorkDesks, stacked behind -->
      <rect x="330" y="205" width="480" height="380" rx="44" fill="#83a598" fill-opacity=".34" filter="url(#card)"/>
      <rect x="330" y="205" width="480" height="380" rx="44" fill="none" stroke="#83a598" stroke-opacity=".55" stroke-width="6"/>
      <rect x="260" y="268" width="500" height="400" rx="44" fill="#b8bb26" fill-opacity=".30" filter="url(#card)"/>
      <rect x="260" y="268" width="500" height="400" rx="44" fill="none" stroke="#b8bb26" stroke-opacity=".55" stroke-width="6"/>

      <!-- the WorkDesk in front -->
      <g filter="url(#card)">
        <rect x="190" y="332" width="540" height="420" rx="46" fill="url(#front)"/>
      </g>
      <rect x="190" y="332" width="540" height="420" rx="46" fill="none" stroke="#ebdbb2" stroke-opacity=".28" stroke-width="6"/>

      <!-- tab bar -->
      <path d="M190 378a46 46 0 0 1 46-46h448a46 46 0 0 1 46 46v36H190z" fill="#1d2021"/>
      <rect x="214" y="350" width="150" height="52" rx="16" fill="#3c3836"/>
      <rect x="378" y="364" width="104" height="24" rx="12" fill="#ebdbb2" fill-opacity=".22"/>
      <rect x="496" y="364" width="84" height="24" rx="12" fill="#ebdbb2" fill-opacity=".14"/>
      <rect x="232" y="366" width="78" height="20" rx="10" fill="#fabd2f"/>

      <!-- terminal prompt -->
      <polyline points="252,510 342,578 252,646" fill="none" stroke="url(#prompt)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="384" y="626" width="132" height="38" rx="19" fill="#ebdbb2"/>
      <rect x="392" y="500" width="250" height="26" rx="13" fill="#ebdbb2" fill-opacity=".22"/>
      <rect x="392" y="552" width="170" height="26" rx="13" fill="#ebdbb2" fill-opacity=".14"/>

      <!-- a Signal: this WorkDesk needs you -->
      <circle cx="716" cy="344" r="74" fill="#fb4934" fill-opacity=".75" filter="url(#glow)"/>
      <circle cx="716" cy="344" r="56" fill="#fb4934" stroke="#1d2021" stroke-width="18"/>
      <circle cx="716" cy="344" r="17" fill="#fbf1c7"/>
    </g>
  </g>
</svg>
